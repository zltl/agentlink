<svg xmlns="http://www.w3.org/2000/svg" width="780" height="280" viewBox="0 0 780 280" role="img" aria-label="agentlink remote desktop path">
  <title>agentlink remote desktop</title>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #1c1917; }
    .box { fill: #faf7f2; stroke: #44403c; stroke-width: 1.5; }
    .relay { fill: #1c1917; }
    .relay-text { fill: #faf7f2; font-weight: 650; }
    .line { stroke: #44403c; stroke-width: 1.5; fill: none; }
    .label { font-size: 12px; fill: #57534e; }
  </style>
  <rect class="box" x="20" y="36" width="150" height="44" rx="8"/>
  <text x="95" y="63" text-anchor="middle">screen capture</text>
  <rect class="box" x="200" y="36" width="120" height="44" rx="8"/>
  <text x="260" y="63" text-anchor="middle">damage</text>
  <rect class="box" x="350" y="36" width="150" height="44" rx="8"/>
  <text x="425" y="63" text-anchor="middle">H.264 encoder</text>
  <rect class="box" x="530" y="36" width="230" height="44" rx="8"/>
  <text x="645" y="63" text-anchor="middle">WebRTC to the browser</text>
  <path class="line" d="M170 58 H200"/>
  <path class="line" d="M320 58 H350"/>
  <path class="line" d="M500 58 H530"/>
  <text class="label" x="260" y="28" text-anchor="middle">skip when the tiles match</text>
  <rect class="box relay" x="300" y="128" width="180" height="44" rx="8"/>
  <text class="relay-text" x="390" y="155" text-anchor="middle">relay signaling</text>
  <path class="line" d="M645 80 V116 H480 V150"/>
  <path class="line" d="M300 150 H230 V80"/>
  <text class="label" x="520" y="112">offer / answer on /v1/webrtc</text>
  <text class="label" x="150" y="118">node answers</text>
  <rect class="box" x="20" y="210" width="200" height="44" rx="8"/>
  <text x="120" y="237" text-anchor="middle">input data channel</text>
  <rect class="box" x="250" y="210" width="200" height="44" rx="8"/>
  <text x="350" y="237" text-anchor="middle">cursor overlay channel</text>
  <rect class="box" x="480" y="210" width="200" height="44" rx="8"/>
  <text x="580" y="237" text-anchor="middle">frame tap</text>
  <path class="line" d="M120 210 V168 H300"/>
  <path class="line" d="M425 80 V210"/>
  <text class="label" x="700" y="200">media stays off the relay</text>
</svg>
