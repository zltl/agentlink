<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="xferTitle xferDesc">
  <title id="xferTitle">agentlink fast transfer</title>
  <desc id="xferDesc">File control stays JSON. File bytes are binary frames through the relay, or a direct QUIC connection when hole punching works. Identical files are skipped, changed files send block deltas, chunks may be zstd, and directories travel as one tar stream.</desc>
  <style>
    :root { color-scheme: light dark; }
    .card { fill: #f4f7fb; stroke: #1f4e79; stroke-width: 1.6; }
    .chip { fill: #e7f0f8; stroke: #1f4e79; stroke-width: 1.4; }
    .label { fill: #142033; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 650; }
    .sub { fill: #3d4d63; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; }
    .chip-label { fill: #142033; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 650; }
    .arrow { stroke: #1f4e79; fill: none; stroke-width: 1.8; }
    .direct { stroke: #1f4e79; fill: none; stroke-width: 1.8; stroke-dasharray: 6 5; }
    .head { fill: #1f4e79; }
    @media (prefers-color-scheme: dark) {
      .card, .chip { fill: #182230; stroke: #9ec1de; }
      .label, .chip-label { fill: #e8eef6; }
      .sub { fill: #b7c6d6; }
      .arrow, .direct { stroke: #9ec1de; }
      .head { fill: #9ec1de; }
    }
  </style>
  <defs>
    <marker id="xfer-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="head"/>
    </marker>
  </defs>

  <rect class="card" x="36" y="48" width="150" height="78" rx="10"/>
  <text class="label" x="111" y="82" text-anchor="middle">client</text>
  <text class="sub" x="111" y="104" text-anchor="middle">CLI or MCP</text>

  <rect class="card" x="390" y="36" width="180" height="102" rx="10"/>
  <text class="label" x="480" y="78" text-anchor="middle">relay</text>
  <text class="sub" x="480" y="100" text-anchor="middle">routes control</text>
  <text class="sub" x="480" y="118" text-anchor="middle">and byte frames</text>

  <rect class="card" x="760" y="48" width="150" height="78" rx="10"/>
  <text class="label" x="835" y="82" text-anchor="middle">node</text>
  <text class="sub" x="835" y="104" text-anchor="middle">disk and exec</text>

  <path class="arrow" marker-end="url(#xfer-arrow)" d="M186 78 H 390"/>
  <path class="arrow" marker-end="url(#xfer-arrow)" d="M570 78 H 760"/>
  <text class="sub" x="288" y="68" text-anchor="middle">JSON + binary frames</text>
  <text class="sub" x="665" y="68" text-anchor="middle">JSON + binary frames</text>

  <path class="direct" marker-end="url(#xfer-arrow)" d="M111 126 C 111 210, 835 210, 835 126"/>
  <text class="sub" x="473" y="198" text-anchor="middle">QUIC direct when the punched path connects; otherwise the relay carries the bytes</text>

  <rect class="chip" x="36" y="248" width="200" height="58" rx="10"/>
  <text class="chip-label" x="136" y="272" text-anchor="middle">BLAKE3 skip</text>
  <text class="sub" x="136" y="292" text-anchor="middle">identical files stay put</text>

  <rect class="chip" x="256" y="248" width="200" height="58" rx="10"/>
  <text class="chip-label" x="356" y="272" text-anchor="middle">block delta</text>
  <text class="sub" x="356" y="292" text-anchor="middle">only changed blocks</text>

  <rect class="chip" x="476" y="248" width="200" height="58" rx="10"/>
  <text class="chip-label" x="576" y="272" text-anchor="middle">zstd chunks</text>
  <text class="sub" x="576" y="292" text-anchor="middle">skipped when already packed</text>

  <rect class="chip" x="696" y="248" width="220" height="58" rx="10"/>
  <text class="chip-label" x="806" y="272" text-anchor="middle">directory tar</text>
  <text class="sub" x="806" y="292" text-anchor="middle">many small files, one transfer</text>
</svg>
