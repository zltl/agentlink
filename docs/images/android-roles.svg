<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="rolesTitle rolesDesc">
  <title id="rolesTitle">Android node and client</title>
  <desc id="rolesDesc">One phone runs either the node service or the client UI. Both dial the relay. The node never listens.</desc>
  <style>
    :root { color-scheme: light dark; }
    .card { fill: #f4f7fb; stroke: #1f4e79; stroke-width: 1.6; }
    .label { fill: #142033; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 650; }
    .sub { fill: #3d4d63; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; }
    .arrow { stroke: #1f4e79; fill: none; stroke-width: 1.8; }
    .head { fill: #1f4e79; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #182230; stroke: #9ec1de; }
      .label { fill: #e8eef6; }
      .sub { fill: #b7c6d6; }
      .arrow { stroke: #9ec1de; }
      .head { fill: #9ec1de; }
    }
  </style>
  <defs>
    <marker id="roles-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="head"/>
    </marker>
  </defs>
  <rect class="card" x="24" y="36" width="250" height="88" rx="10"/>
  <text class="label" x="149" y="70" text-anchor="middle">Phone as a node</text>
  <text class="sub" x="149" y="92" text-anchor="middle">foreground service, outbound only</text>
  <text class="sub" x="149" y="110" text-anchor="middle">files, shell, screen, input</text>
  <rect class="card" x="24" y="156" width="250" height="88" rx="10"/>
  <text class="label" x="149" y="190" text-anchor="middle">Phone as a client</text>
  <text class="sub" x="149" y="212" text-anchor="middle">machines, files, shell, transfer</text>
  <text class="sub" x="149" y="230" text-anchor="middle">audit log and remote view</text>
  <rect class="card" x="520" y="96" width="200" height="88" rx="10"/>
  <text class="label" x="620" y="132" text-anchor="middle">relay</text>
  <text class="sub" x="620" y="154" text-anchor="middle">only listener</text>
  <text class="sub" x="620" y="172" text-anchor="middle">policy and routes</text>
  <path class="arrow" marker-end="url(#roles-arrow)" d="M274 80 H520"/>
  <path class="arrow" marker-end="url(#roles-arrow)" d="M274 200 H400 V140 H520"/>
  <text class="sub" x="390" y="68" text-anchor="middle">wss + pinned cert</text>
</svg>
