name: bench

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  bench:
    name: micro guard and loopback bench
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install copy tools
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client pkg-config g++ nasm libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - name: Microbenchmark regression guard
        run: cargo bench --manifest-path bench-micro/Cargo.toml --locked -- --guard --baseline ../benches/baseline.json
      - name: Release binary
        run: cargo build --release --locked -p agentlink-cli
      - name: End-to-end bench
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./target/release/agentlink bench --quick --out bench-results.md
          else
            ./target/release/agentlink bench --out bench-results.md
          fi
      - name: Job summary
        if: always()
        run: |
          if [ -f bench-results.md ]; then
            echo "## agentlink bench" >> "$GITHUB_STEP_SUMMARY"
            cat bench-results.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentlink-bench
          path: |
            bench-results.md
            benches/baseline.json
