[package]
name = "agentlink-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Desktop capture, input injection, and accessibility for agentlink"

[dependencies]
agentlink-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
webp = "0.3"
bytes = "1"
async-trait = "0.1"
webrtc = { version = "0.21.1", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
rtc = { version = "0.21.1", default-features = false, features = ["crypto-ring"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shm", "xtest", "randr", "damage", "xfixes"] }
zbus = { version = "4.4", default-features = false, features = ["tokio", "blocking"] }
libloading = "0.8"
libc = "0.2"
futures-util.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_StationsAndDesktops",
    "Win32_Globalization",
    "Win32_System_SystemServices",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Imaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11"


[dev-dependencies]
tempfile.workspace = true
agentlink-view = { workspace = true }


[[bin]]
name = "agentlink-stream-fixture"
path = "src/bin/agentlink-stream-fixture.rs"
