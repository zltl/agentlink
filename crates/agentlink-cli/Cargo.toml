[package]
name = "agentlink-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "agentlink CLI, node, relay, and MCP server"

[lib]
name = "agentlink_cli"
path = "src/lib.rs"

[[bin]]
name = "agentlink"
path = "src/main.rs"

[[bin]]
name = "agentlink-gui"
path = "src/bin/agentlink_gui.rs"

[features]
default = ["controller"]
controller = [
    "dep:agentlink-view",
    "dep:eframe",
    "dep:image",
    "dep:openh264",
    "dep:alacritty_terminal",
    "dep:unicode-width",
    "dep:ksni",
]

[dependencies]
agentlink-core.workspace = true
agentlink-relay.workspace = true
agentlink-node.workspace = true
agentlink-desktop.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
hostname.workspace = true
toml.workspace = true
crossterm.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
sha2.workspace = true
url.workspace = true
uuid.workspace = true
tar.workspace = true
blake2 = "0.10"
flate2 = { version = "1.0.35", default-features = false, features = ["rust_backend"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
webpki-roots = "0.26"
sysinfo.workspace = true
tempfile.workspace = true

# The controller window is glibc Linux, macOS, and Windows. Musl release
# archives and `--no-default-features` builds stay headless so they do not
# pull GUI toolkits, OpenH264, or libstdc++.
[target.'cfg(not(target_env = "musl"))'.dependencies]
agentlink-view = { workspace = true, optional = true }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
openh264 = { version = "0.8", optional = true }
# Alacritty's VT/grid core (Apache-2.0). Used for the desktop Controller
# terminal; we feed the remote agentlink PTY and do not spawn a local tty.
alacritty_terminal = { version = "0.25.1", optional = true }
# Same width table alacritty uses for speculative local-echo cell advance.
unicode-width = { version = "0.2", optional = true }

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
ksni = { version = "0.3.7", optional = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
