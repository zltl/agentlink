[package]
name = "agentlink-view"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "WebRTC viewer that turns the desktop stream into H.264 Annex-B"

[dependencies]
agentlink-core.workspace = true
async-trait = "0.1"
base64.workspace = true
serde_json.workspace = true
tokio.workspace = true
webrtc = { version = "0.21.1", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
rtc = { version = "0.21.1", default-features = false, features = ["crypto-ring"] }

[dev-dependencies]
agentlink-desktop = { workspace = true }
# Example-only: webrtc_stage_probe dimension probe (same crate as Controller H264Decoder).
openh264 = "0.8"
